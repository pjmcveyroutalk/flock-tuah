name: CLC v70 r3 crates vendor ferry

on:
  push:
    branches:
      - clc-v70-r3-toolchain-ferry-20260917
    paths:
      - '.clc-ferry/vendor.trigger'

permissions:
  contents: read

jobs:
  package-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and vendor public crates
        shell: bash
        env:
          INVENTORY_B64: ''
        run: |
          set -euo pipefail
          mkdir -p ferry vendor
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, tarfile, time, urllib.parse, urllib.request
          rows = []
          raw = gzip.decompress(base64.b64decode(os.environ["INVENTORY_B64"])).decode()
          for line in raw.splitlines():
              if not line:
                  continue
              name, version = line.split("\t", 1)
              rows.append((name, version))
          if len(rows) != 558 or len(set(rows)) != 558:
              raise SystemExit(f"unexpected inventory count: {len(rows)} / unique {len(set(rows))}")
          vendor = pathlib.Path("vendor")
          archive_hashes = []
          opener = urllib.request.build_opener()
          opener.addheaders = [("User-Agent", "cargo-vendor-ferry/1.0")]
          for idx, (name, version) in enumerate(rows, 1):
              n = urllib.parse.quote(name, safe="")
              fn = urllib.parse.quote(f"{name}-{version}.crate", safe="")
              url = f"https://static.crates.io/crates/{n}/{fn}"
              data = None
              for attempt in range(6):
                  try:
                      with opener.open(url, timeout=120) as resp:
                          data = resp.read()
                      break
                  except Exception as exc:
                      if attempt == 5:
                          raise
                      time.sleep(2 ** attempt)
              package_hash = hashlib.sha256(data).hexdigest()
              dest = vendor / f"{name}-{version}"
              dest.mkdir(parents=True, exist_ok=False)
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tf:
                  members = tf.getmembers()
                  prefix = f"{name}-{version}/"
                  for m in members:
                      if m.issym() or m.islnk():
                          raise SystemExit(f"link forbidden in crate {name} {version}: {m.name}")
                      if not m.name.startswith(prefix):
                          raise SystemExit(f"unexpected archive path in {name} {version}: {m.name}")
                      rel = pathlib.PurePosixPath(m.name[len(prefix):])
                      if not rel.parts:
                          continue
                      if rel.is_absolute() or ".." in rel.parts:
                          raise SystemExit(f"unsafe archive path: {m.name}")
                      target = dest.joinpath(*rel.parts)
                      if m.isdir():
                          target.mkdir(parents=True, exist_ok=True)
                      elif m.isfile():
                          target.parent.mkdir(parents=True, exist_ok=True)
                          src = tf.extractfile(m)
                          target.write_bytes(src.read())
                      else:
                          raise SystemExit(f"unsupported archive entry: {m.name}")
              files = {}
              for p in sorted(dest.rglob("*")):
                  if p.is_file():
                      rel = p.relative_to(dest).as_posix()
                      files[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
              (dest / ".cargo-checksum.json").write_text(
                  json.dumps({"files": files, "package": package_hash}, separators=(",", ":"), sort_keys=True) + "\n"
              )
              archive_hashes.append((name, version, package_hash, len(data)))
              if idx % 50 == 0 or idx == len(rows):
                  print(f"downloaded {idx}/{len(rows)} crates", flush=True)
          pathlib.Path("ferry/ARCHIVE_SHA256.tsv").write_text(
              "".join(f"{n}\t{v}\t{h}\t{s}\n" for n,v,h,s in archive_hashes)
          )
          pathlib.Path("ferry/INVENTORY_SHA256.txt").write_text(
              hashlib.sha256(raw.encode()).hexdigest() + "  crates-inventory.tsv\n"
          )
          print("PASS: downloaded and checksummed 558 public crates")
          PY

      - name: Package vendored source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf ferry/clc-v70-r3-crates-vendor.tar.gz vendor
          sha256sum ferry/clc-v70-r3-crates-vendor.tar.gz >> ferry/SHA256SUMS
          sha256sum ferry/ARCHIVE_SHA256.tsv >> ferry/SHA256SUMS
          du -sh vendor ferry/clc-v70-r3-crates-vendor.tar.gz

      - name: Upload vendored crates
        uses: actions/upload-artifact@v4
        with:
          name: clc-v70-r3-crates-vendor-linux
          path: ferry/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
